<div class="overlay">
  <div class="modal" >

    <h3>{{ title }}</h3>
    <p>{{ message }}</p>

    <div class="actions">
      <button class="cancel" (click)="cancel.emit()">
        {{ isConfirm ? 'Cancel' : 'OK' }}
      </button>

      <button 
        *ngIf="isConfirm"
        class="confirm"
        (click)="confirm.emit()">
        Confirm
      </button>
    </div>

  </div>
</div>
